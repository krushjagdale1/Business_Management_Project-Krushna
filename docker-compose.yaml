
services:

  mysql:
    image: mysql:8.0
    container_name: business-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: businessproject

    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=30

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    mem_limit: 384m

  app:
    build: .
    container_name: business-management
    restart: unless-stopped

    ports:
      - "2330:2330"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/businessproject
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ActiveProcessorCount=1"

    depends_on:
      mysql:
        condition: service_healthy

    mem_limit: 512m

volumes:
  mysql_data:

