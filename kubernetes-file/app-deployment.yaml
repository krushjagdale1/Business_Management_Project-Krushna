apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-management
  namespace: krushna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: business-management
  template:
    metadata:
      labels:
        app: business-management
    spec:
      containers:
        - name: business-management
          image: krushjagdale1/business-management:v2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 2330
          envFrom:
            - configMapRef:
                name: business-management-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: SPRING_DATASOURCE_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 2330
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2330
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
